[package]
name = "imbuuid-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Portable standalone Rust TUI memory browser (ratatui + crossterm) over the imbuuid-mem store — local-first, filter-as-you-type search"

[dependencies]
# Wired against Crew 1's real crates/imbuuid-mem (all six modules landed
# 2026-10-17). Dev ran against a private /tmp harness with the same API.
imbuuid-mem = { path = "../imbuuid-mem" }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[build-dependencies]
# Spec said sha2 = "1"; no 1.x exists on crates.io (tops at 0.11.x).
# 0.10 carries the identical Digest API provenance-build.rs needs.
sha2 = "0.10"
